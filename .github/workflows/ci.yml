name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --python "${{ matrix.python }}"
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  no-spec-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Code states its rules instead of citing the planning docs
        run: "! git grep -nP 'ARCHITECTURE|docs/|ADR-|adr/|research/|\\b[CR][0-9]{2}\\b' -- src tests"
