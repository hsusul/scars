[project]
name = "scars"
version = "0.0.1"
description = "Stops coding agents from repeating mistakes another local session already fixed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Henry Su" }]
dependencies = []

[project.scripts]
scars = "scars.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scars"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["research", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
